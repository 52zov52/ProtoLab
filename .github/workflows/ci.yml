name: CI

on:
  push:
  pull_request:

# The whole point of this repository is that claims are checked against real
# data.  CI therefore runs the same commands the README tells a reviewer to run,
# including the end-to-end demo scenario (§23, Этап 5) — not a reduced subset.
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the backend (with the analytics and dev extras)
        run: pip install -e "backend[dev,analytics]"

      - name: Generate the synthetic test bench
        run: python tools/testbench/generate.py --out data/testbench

      - name: Backend tests
        run: python -m pytest backend -q

      - name: End-to-end demo scenario (17 steps)
        run: python scripts/demo_scenario.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
