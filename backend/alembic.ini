# Alembic configuration for the Madrigal Protocol Lab backend.
#
# The database URL is deliberately NOT set here: `alembic/env.py` reads it from
# the same Settings object the API uses (MPLAB_DATABASE_URL, or the SQLite file
# under MPLAB_DATA_DIR), so a migration can never quietly target a different
# database than the application.
#
#   cd backend
#   python -m alembic upgrade head                   # apply migrations
#   python -m alembic revision --autogenerate -m "…" # scaffold a new revision
#   python -m alembic current                        # current revision
#
# Revision ids are human-readable on purpose: a single "0001" is easier to
# follow in a one-service project than a random hash.

[alembic]
script_location = alembic
prepend_sys_path = .

[sqlalchemy]
# Overridden at runtime by alembic/env.py from the application settings.
url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
