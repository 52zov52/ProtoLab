version: '3.8'

networks:
  madrigal-net:
    driver: bridge
    ipam:
      config:
        - subnet: 127.0.0.0/24

services:
  backend:
    build: ./backend
    container_name: madrigal-backend
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      - MPLAB_MODE=local_secure
      - MPLAB_HOST=127.0.0.1
      - MPLAB_PORT=8010
      - MPLAB_ALLOWED_HOSTS=127.0.0.1,localhost
      - MPLAB_FRONTEND_ORIGINS=http://localhost:3000
      - MPLAB_DEBUG=false
    volumes:
      - ./backend/data:/app/data:ro
      - ./backend/logs:/app/logs
    networks:
      madrigal-net:
        ipv4_address: 127.0.0.10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: madrigal-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://127.0.0.10:8010
    networks:
      madrigal-net:
        ipv4_address: 127.0.0.11
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    container_name: madrigal-db
    environment:
      - POSTGRES_DB=madrigal
      - POSTGRES_USER=madrigal
      - POSTGRES_PASSWORD=${MPLAB_DB_PASSWORD:-madrigal_secure_password}
      - POSTGRES_INITDB_ARGS=--auth-local=trust --auth-host=md5
    volumes:
      - ./backend/data/db:/var/lib/postgresql/data
      - ./backend/data/backups:/backups
    networks:
      madrigal-net:
        ipv4_address: 127.0.0.12
    restart: unless-stopped
    healthcheck:
      test: ["cmd", "pg_isready", "-U", "madrigal", "-d", "madrigal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: madrigal-redis
    command: redis-server --appendonly yes --requirepass ${MPLAB_REDIS_PASSWORD:-redis_secure_password}
    volumes:
      - ./backend/data/redis:/data
    networks:
      madrigal-net:
        ipv4_address: 127.0.0.13
    restart: unless-stopped
    healthcheck:
      test: ["cmd", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: madrigal-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./backend/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./backend/monitoring/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    networks:
      madrigal-net:
        ipv4_address: 127.0.0.14
    restart: unless-stopped
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: madrigal-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=madrigal_grafana_admin
    volumes:
      - ./backend/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    networks:
      madrigal-net:
        ipv4_address: 127.0.0.15
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:

profiles:
  local:
    services:
      db:
      redis:
      prometheus:
      grafana:
  monitoring:
    services:
      prometheus:
      grafana: