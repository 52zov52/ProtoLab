# Madrigal Protocol Lab - local, offline-first deployment.
#
# Both services publish on loopback only. The backend's own Host/Origin
# allowlist is the defence against browser attacks and DNS rebinding; binding to
# 127.0.0.1 is what keeps it off the network.
#
# Note on storage: the app uses SQLite plus filesystem artefacts, NOT Postgres
# or Redis. Those services were in an earlier draft of this file and were
# removed because nothing in the codebase uses them - shipping a database the
# application never connects to would imply capabilities it does not have.

name: madrigal-protocol-lab

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: madrigal-backend
    # Loopback only. Do not change to 0.0.0.0 without reading
    # docs/SECURITY.md and setting up authentication, TLS and a reverse proxy.
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      MPLAB_MODE: local_secure
      # Inside a container the process must bind every interface in its own
      # network namespace, otherwise the published port cannot route to it.
      # The host-side mapping below ("127.0.0.1:8010:8010") is what actually
      # restricts reachability to the local machine.
      MPLAB_HOST: 0.0.0.0
      MPLAB_ALLOW_NON_LOOPBACK_BIND: "true"
      MPLAB_PORT: 8010
      MPLAB_DATA_DIR: /app/data
      # The frontend is served on loopback:3000 in this compose file.
      MPLAB_ALLOWED_HOSTS: 127.0.0.1,localhost,madrigal-backend
      MPLAB_FRONTEND_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      MPLAB_DEBUG: "false"
      MPLAB_LOG_LEVEL: INFO
      # Narration (assistant and report prose) is OFF by default. Nothing leaves
      # the machine unless an operator sets MPLAB_ALLOW_EXTERNAL_AI=true here or
      # in .env — and even then a project must record its own consent, and only
      # redacted, aggregated findings are ever sent.
      MPLAB_ALLOW_EXTERNAL_AI: ${MPLAB_ALLOW_EXTERNAL_AI:-false}
      # "auto" uses a hosted OpenAI-compatible endpoint when all three of
      # MPLAB_LLM_BASE_URL / MPLAB_LLM_API_KEY / MPLAB_LLM_MODEL are set, and a
      # local Ollama instance otherwise. "none" disables narration outright.
      MPLAB_LLM_PROVIDER: ${MPLAB_LLM_PROVIDER:-auto}
      MPLAB_LLM_BASE_URL: ${MPLAB_LLM_BASE_URL:-}
      # Keep the key in .env (git-ignored), never in this file.
      MPLAB_LLM_API_KEY: ${MPLAB_LLM_API_KEY:-}
      MPLAB_LLM_MODEL: ${MPLAB_LLM_MODEL:-}
      # Only used when the optional "ai" profile supplies a model. Override in
      # .env to point at the compose Ollama service (http://madrigal-ollama:11434).
      MPLAB_OLLAMA_URL: ${MPLAB_OLLAMA_URL:-http://127.0.0.1:11434}
      MPLAB_OLLAMA_MODEL: ${MPLAB_OLLAMA_MODEL:-qwen2.5:7b-instruct}
    volumes:
      # Read-only source captures; the app writes its own artefacts elsewhere.
      - ./data/testbench:/captures:ro
      - mplab-data:/app/data
    # --- hardening -------------------------------------------------------
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - lab

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: madrigal-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # The browser calls the API directly (the client in lib/api.ts is
      # browser-side). Both ports are published on the host's loopback, so this
      # resolves on the analyst's machine and never leaves it.
      NEXT_PUBLIC_API_BASE: http://127.0.0.1:8010
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - lab

  # Optional local narration model for the report/assistant features.
  #
  #   docker compose --profile ai up
  #
  # This service is never started without the profile, and even then nothing is
  # sent to it until MPLAB_ALLOW_EXTERNAL_AI=true and the project records its own
  # consent. Only aggregated, redacted summaries are ever sent.
  ollama:
    image: ollama/ollama:latest
    container_name: madrigal-ollama
    profiles:
      - ai
    ports:
      # Published on loopback only, so the host `ollama` CLI can pull a model.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    networks:
      - lab

volumes:
  # SQLite database, capture artefacts and exports. Deleting a project through
  # the UI removes only that project's subtree.
  mplab-data:
  # Downloaded models for the optional "ai" profile. Safe to delete; the model
  # is re-pulled on next use.
  ollama-models:

networks:
  lab:
    driver: bridge